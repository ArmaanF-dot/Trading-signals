name: form4
on:
  schedule:
    - cron: "7 */2 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signals-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python run.py form4
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: Commit data
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add data signals
          git diff --cached --quiet || (git commit -m "data: form4 update" && git pull --rebase && git push)
