name: reversal
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python run.py reversal
        env:
          PYTHONUNBUFFERED: "1"
      - name: Commit report
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "reports: mean reversion backtest"
          for i in 1 2 3 4; do git pull --rebase && git push && exit 0; sleep $((i * 10)); done
          exit 1
