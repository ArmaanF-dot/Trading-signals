name: colombia-macro
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pandas numpy
      - run: python scripts/colombia_macro.py data/colombia 2>&1 | tee reports/colombia_macro_log.txt
      - name: Commit report
        if: ${{ !cancelled() }}
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet && exit 0
          git commit -m "reports: colombia macro study"
          for i in 1 2 3 4; do git pull --rebase && git push && exit 0; sleep $((i * 10)); done
          exit 1
