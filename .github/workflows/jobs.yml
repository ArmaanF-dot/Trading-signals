name: jobs
on:
  schedule:
    - cron: "15 6 * * *"  # once a day, every day: postings change at weekends too
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: signals-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python run.py jobs
        env:
          PYTHONUNBUFFERED: "1"
      - name: Commit data
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add data/jobs
          git diff --cached --quiet || (git commit -m "data: jobs snapshot" && git pull --rebase && git push)
