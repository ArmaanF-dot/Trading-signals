name: backtest
on:
  workflow_dispatch:
    inputs:
      start_year: {description: "First year", default: "2021"}
      end_year: {description: "Last year", default: "2025"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python run.py backtest ${{ inputs.start_year }} ${{ inputs.end_year }}
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: Commit report
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || (git commit -m "reports: form4 backtest" && git pull --rebase && git push)
