name: jobs-probe
on:
  push:
    branches: [claude/project-thread-x9c0lp]
    paths: [".github/workflows/jobs-probe.yml", "scripts/wb_probe.py"]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - run: python scripts/wb_probe.py
        env: {PYTHONUNBUFFERED: "1"}
