name: opportunistic
on:
  workflow_dispatch:
    inputs:
      first_year: {description: "First test year", default: "2023"}
      last_year: {description: "Last year", default: "2025"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python run.py opportunistic ${{ inputs.first_year }} ${{ inputs.last_year }}
        env:
          PYTHONUNBUFFERED: "1"
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: Commit report
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || (git commit -m "reports: opportunistic study" && git pull --rebase && git push)
