name: jets-probe
on:
  push:
    branches: [claude/project-thread-sn3kjb]
    paths: [".github/workflows/jets-probe.yml", "edge/jets/**"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: Release layout
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/adsblol/globe_history_2024/releases/tags/v2024.06.12-planes-readsb-prod-0 | python -c "import json,sys; d=json.load(sys.stdin); [print(a['name'],a['size']) for a in d.get('assets',[])]"
          for y in 2023 2025 2026; do curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/adsblol/globe_history_$y/releases?per_page=2" | python -c "import json,sys; d=json.load(sys.stdin); print('$y', [r.get('tag_name') for r in d] if isinstance(d,list) else d)"; done
          curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/adsblol/globe_history_2023/releases?per_page=100&page=4" | python -c "import json,sys; d=json.load(sys.stdin); print([r.get('tag_name') for r in d][-5:])"
      - name: Peek at tar layout
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          u=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/adsblol/globe_history_2024/releases/tags/v2024.06.12-planes-readsb-prod-0 | python -c "import json,sys; d=json.load(sys.stdin); print(sorted(a['browser_download_url'] for a in d['assets'] if '.tar.a' in a['name'])[0])")
          curl -sL "$u" | head -c 300000000 | tar -tvf - 2>/dev/null | head -40 || true
          curl -sL "$u" | head -c 300000000 | tar -xf - --wildcards '*trace_full_a*' 2>/dev/null || true
          f=$(find . -name 'trace_full_a*' | head -1); echo "$f"; (zcat "$f" 2>/dev/null || cat "$f") | head -c 1500; echo
      - name: One full day
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: |
          python run.py jets-history 2024-06-12 2024-06-12
          head -50 data/jets/history/2024-06-12.csv || true
          wc -l data/jets/history/2024-06-12.csv || true
