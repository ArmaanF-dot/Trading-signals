name: text-study
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python run.py text-study
        env:
          PYTHONUNBUFFERED: "1"
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: Commit report
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || (git commit -m "reports: 10-K/10-Q text study" && git pull --rebase && git push)
