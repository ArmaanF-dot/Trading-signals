name: fca-study
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: python run.py fca-study
        env:
          PYTHONUNBUFFERED: "1"
      - name: Commit report
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@users.noreply.github.com"
          git add reports data
          git diff --cached --quiet || (git commit -m "reports: fca shorts study" && git pull --rebase && git push)
